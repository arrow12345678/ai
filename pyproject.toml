[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ali_project1"
version = "1.0.0"
description = "ALPR (Automatic License Plate Recognition) Project"
authors = [{name = "Ali", email = "ali@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tensorflow>=2.13.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "Pillow>=10.0.0",
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "albumentations>=1.3.0",
    "seaborn>=0.12.0",
    "tensorboard>=2.13.0",
    "scipy>=1.11.0",
    "imageio>=2.31.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "pytesseract>=0.3.10"
]

[tool.setuptools]
packages = ["src"]

[tool.pyright]
include = ["src", "."]
exclude = ["**/node_modules", "**/__pycache__"]
pythonVersion = "3.11"
pythonPlatform = "Windows"
executionEnvironments = [
    {
        root = ".",
        pythonVersion = "3.11",
        pythonPlatform = "Windows",
        extraPaths = [
            "C:/Users/haide/AppData/Local/Programs/Python/Python311/Lib/site-packages"
        ]
    }
]
reportMissingImports = "warning"
reportMissingTypeStubs = false
typeCheckingMode = "off"
